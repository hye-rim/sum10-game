<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>합 10 지우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게. 입력칸은 그대로 선택·붙여넣기 되게 둔다 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, [contenteditable] { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #4f8cff 0%, #6b5cff 55%, #8a4fe0 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #stage { width:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; }
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 8px; font-variant-numeric:tabular-nums; width:100%; position:relative; z-index:2; }
  #hud .item {
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:2px 12px; height:38px;
  }
  #hud .item.score { background:var(--yellow); flex:1; min-width:0; }
  #hud .label { font-size:11px; color:var(--muted); }
  #hud .item.score .label { color:#8a5a00; }
  #hud .value { font-size:21px; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink); position:relative;
    width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer; box-shadow:0 4px 0 var(--ink);
  }
  #hud button::after { content:''; position:absolute; inset:-10px -6px; }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

  #wrap { position:relative; }

  #overlay {
    position:absolute; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px;
    text-align:center; padding:18px; background:rgba(43,29,82,.74); border-radius:22px;
    backdrop-filter:blur(3px); overflow-y:auto; touch-action:pan-y;
  }
  #overlay.hidden { display:none; }
  #overlay h1, #overlay h2 { color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay h1 { font-size:clamp(40px, 12vw, 54px); line-height:1.05; color:var(--yellow); }
  #overlay h2 { font-size:30px; }
  #overlay p { font-size:14px; line-height:1.55; color:#fff; }
  #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .big { font-size:48px; color:var(--yellow); font-variant-numeric:tabular-nums; line-height:1; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay .tag { display:inline-block; background:var(--pink); color:#fff; font-size:15px; padding:3px 14px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); }
  #overlay .card2 {
    font-size:14px; color:var(--ink); line-height:1.7; text-align:left; background:#fff; border:3px solid var(--ink);
    border-radius:18px; box-shadow:0 5px 0 var(--ink); padding:10px 16px;
  }
  #overlay .stats { display:grid; grid-template-columns:auto auto; gap:3px 18px; font-size:16px; font-variant-numeric:tabular-nums; }
  #overlay .stats dt { color:var(--muted); text-align:right; }
  #overlay button {
    background:var(--yellow); color:var(--ink); font-size:21px; font-family:inherit; border:3px solid var(--ink);
    border-radius:999px; padding:10px 36px; box-shadow:0 5px 0 var(--ink); cursor:pointer;
  }
  #overlay button small { display:block; font-size:12px; color:var(--muted); margin-top:1px; }
  #overlay button.sub { background:#fff; font-size:16px; padding:7px 22px; box-shadow:0 4px 0 var(--ink); }
  #overlay button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  #overlay .col { display:flex; flex-direction:column; align-items:center; gap:9px; }

  @media (max-width:420px) {
    #hud { gap:4px; }
    #hud .label { display:none; }
    #hud .item { padding:2px 10px; height:34px; box-shadow:0 3px 0 var(--ink); }
    #hud .value { font-size:17px; }
    #hud button { width:32px; height:32px; font-size:13px; box-shadow:0 3px 0 var(--ink); }
  }
  @media (max-height:700px) {
    #overlay { gap:8px; padding:12px; }
    #overlay h1 { font-size:38px; } #overlay h2 { font-size:26px; } #overlay .big { font-size:38px; }
    #overlay p, #overlay .card2 { font-size:12.5px; }
    #overlay button { font-size:18px; padding:8px 28px; }
  }


  #col { width:min(100%, 400px); }
  #wrap { position:relative; width:100%; }
  #hud .item .value { min-width:1.4em; text-align:center; }
  @media (max-width:420px) { #hud .label { display:inline; font-size:9px; } #hud .item { padding:2px 8px; gap:3px; } #hud .value { font-size:17px; } }
  #hud .item.time { background:#fff; }
  #hud .item.time.low .value { color:#e0245e; }
  #hud .item.score { flex:1; }
  #hud button:disabled { opacity:.4; box-shadow:0 4px 0 var(--ink); }
  #hintBtn { position:relative; }
  #hintBtn small { position:absolute; right:-5px; top:-7px; background:var(--pink); color:#fff; border:2px solid var(--ink); border-radius:999px; font-size:10px; min-width:16px; height:16px; line-height:12px; text-align:center; }
  #bar { height:10px; width:100%; background:rgba(255,255,255,.35); border:3px solid var(--ink); border-radius:999px; overflow:hidden; margin:0 0 8px; }
  #bar i { display:block; height:100%; width:100%; background:#4cd964; transform-origin:left; transition:background .3s; }
  #bar.low i { background:#ff5fa2; }
  #panel { background:rgba(255,255,255,.16); border:4px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink); padding:8px; }
  #board { position:relative; display:grid; grid-template-columns:repeat(10, 1fr); gap:3px; width:100%; touch-action:none; }
  .cell { aspect-ratio:1; border-radius:9px; background:#fff; border:2.5px solid var(--ink); box-shadow:0 2px 0 var(--ink); display:flex; align-items:center; justify-content:center; font-size:clamp(16px, 5.4vw, 22px); color:var(--ink); position:relative; }
  .cell.n1 { background:#ffe3e3; } .cell.n2 { background:#ffe8cc; } .cell.n3 { background:#fff3bf; } .cell.n4 { background:#e9fac8; } .cell.n5 { background:#c3fae8; }
  .cell.n6 { background:#d0ebff; } .cell.n7 { background:#dbe4ff; } .cell.n8 { background:#e5dbff; } .cell.n9 { background:#fcc2d7; }
  .cell.empty { background:rgba(255,255,255,.12); border-color:rgba(43,29,82,.25); box-shadow:none; color:transparent; }
  .cell.pop { animation:pop .32s ease-out forwards; }
  @keyframes pop { 0% { transform:scale(1); } 40% { transform:scale(1.25); background:#ffd23f; } 100% { transform:scale(.2); opacity:0; } }
  #sel { position:absolute; pointer-events:none; border:4px solid #ffb300; background:rgba(255,210,63,.28); border-radius:12px; display:none; z-index:3; }
  #sel.ok { border-color:#22c55e; background:rgba(76,217,100,.35); }
  #sel.over { border-color:#ef4444; background:rgba(239,68,68,.25); }
  #sel b { position:absolute; right:-4px; top:-14px; background:var(--ink); color:#fff; border-radius:999px; font-weight:400; font-size:15px; min-width:26px; height:26px; line-height:26px; text-align:center; padding:0 6px; }
  #sel.ok b { background:#16a34a; }
  #sel.over b { background:#dc2626; }
  #hintbox { position:absolute; pointer-events:none; border:4px dashed #7c4dff; background:rgba(124,77,255,.18); border-radius:12px; display:none; z-index:2; animation:hb .6s ease-in-out infinite alternate; }
  @keyframes hb { from { opacity:.5; } to { opacity:1; } }
  .float { position:absolute; pointer-events:none; z-index:6; font-size:24px; color:#fff; paint-order:stroke fill; -webkit-text-stroke:5px var(--ink); animation:fl .9s ease-out forwards; transform:translate(-50%,-50%); white-space:nowrap; }
  @keyframes fl { from { opacity:1; margin-top:0; } to { opacity:0; margin-top:-50px; } }
  #msg { min-height:34px; margin-top:8px; font-size:14px; color:#fff; text-shadow:0 2px 0 var(--ink); text-align:center; line-height:1.35; white-space:pre-line; }
  #combo { position:absolute; left:50%; top:-4px; transform:translateX(-50%); z-index:5; background:var(--pink); color:#fff; border:3px solid var(--ink); border-radius:999px; padding:1px 14px; font-size:16px; box-shadow:0 3px 0 var(--ink); display:none; }
  #overlay .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #overlay .stats { grid-template-columns:auto auto; }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item time" id="timeItem"><span class="label">TIME</span><span class="value" id="time">60</span></div>
      <div class="item score"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
      <div class="item"><span class="label">BEST</span><span class="value" id="best">0</span></div>
      <div class="icons">
        <button id="hintBtn" title="힌트">💡<small id="hintLeft">3</small></button>
        <button id="muteBtn" title="소리 (M)">🔊</button>
      </div>
    </div>
    <div id="bar"><i id="barFill"></i></div>
    <div id="wrap">
      <div id="panel">
        <div id="combo"></div>
        <div id="board"><div id="hintbox"></div><div id="sel"><b></b></div></div>
        <div id="msg"></div>
      </div>
      <div id="overlay"></div>
    </div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
